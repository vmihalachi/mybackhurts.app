<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card. Rendered to og-{lang}.png at build time; {{og.*}} comes from src/i18n;
       {{fit.*}} is each block's font size, shrunk until its longest line fits (render.ts). -->
  <defs>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#ffc3dd" />
    </pattern>
    <!-- sparse ink specks instead of full-frame noise: keeps the PNG small -->
    <pattern id="grain-dots" width="37" height="41" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.9" fill="#26336b" opacity="0.22" />
      <circle cx="21" cy="17" r="0.7" fill="#26336b" opacity="0.18" />
      <circle cx="31" cy="33" r="1" fill="#26336b" opacity="0.15" />
      <circle cx="12" cy="30" r="0.6" fill="#26336b" opacity="0.2" />
    </pattern>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="3" />
    </filter>
    <g id="fig" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 151 L196 150" />
      <path d="M30 113 L62 113 M31 113 L26 73 M33 113 L33 150 M59 113 L59 150" />
      <path d="M96 92 L188 91 M180 92 L181 150" />
      <path d="M104 89 L142 89 L153 57" />
      <path stroke-width="2.5" d="M163 88 L163 76 L175 76 L175 88 M175 79 Q181 80 175 85" />
      <path stroke-width="2.5" d="M167 70 Q164 65 168 61 Q171 57 168 53" />
      <path d="M50 108 L84 108 L84 146 L97 146" />
      <g transform="rotate(24 50 108)">
        <path d="M50 108 Q43 84 50 60" />
        <circle cx="50" cy="46" r="11" fill="#f3ede1" />
        <path d="M50 66 L50 106" transform="rotate(-62 50 66)" />
      </g>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#f3ede1" />
  <rect width="1200" height="630" fill="url(#grain-dots)" />

  <!-- halftone blob behind the figure -->
  <circle cx="965" cy="385" r="190" fill="url(#halftone)" />

  <!-- pink tape strip -->
  <g transform="rotate(-3 220 72)">
    <rect x="56" y="46" width="{{tapeWidth}}" height="52" fill="#ff4d9d" />
    <text x="80" y="81" font-family="Courier Prime" font-weight="700"
      font-size="22" letter-spacing="3" fill="#26336b">{{og.tape}}</text>
  </g>

  <!-- wordmark -->
  <text x="1128" y="90" text-anchor="end" font-family="Zine Display" font-size="34" fill="#26336b">mybackhurts</text>

  <!-- headline with pink misregistration -->
  <g font-family="Zine Display" font-size="{{fit.headline}}">
    <g fill="#ff4d9d" transform="translate(6 5)">
      <text x="72" y="222">{{og.headline1}}</text>
      <text x="72" y="306">{{og.headline2}}</text>
    </g>
    <g fill="#26336b">
      <text x="72" y="222">{{og.headline1}}</text>
      <text x="72" y="306">{{og.headline2}}</text>
    </g>
  </g>

  <!-- tagline -->
  <g font-family="Courier Prime" font-size="{{fit.tagline}}" fill="#26336b">
    <text x="74" y="382">{{og.tagline1}}</text>
    <text x="74" y="422">{{og.tagline2}}</text>
  </g>

  <!-- footer -->
  <text x="76" y="512" font-family="Reenie Beanie" font-size="{{fit.footerNote}}" fill="#c8105f">{{og.footerNote}}</text>
  <path d="M74 536 L660 532" stroke="#26336b" stroke-width="3" stroke-linecap="round" />
  <text x="74" y="584" font-family="Courier Prime" font-weight="700" font-size="28" fill="#26336b">mybackhurts.app</text>

  <!-- slumped stick figure (pink-soft shadow copy + ink) -->
  <g filter="url(#wobble)">
    <use href="#fig" stroke="#ffc3dd" transform="translate(770 250) scale(2) translate(2 1.5)" />
    <use href="#fig" stroke="#26336b" transform="translate(770 250) scale(2)" />
  </g>
  <text x="800" y="318" font-family="Reenie Beanie" font-size="64" fill="#c8105f" transform="rotate(-8 800 318)">{{og.noteOw}}</text>
</svg>
