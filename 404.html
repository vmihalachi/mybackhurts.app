<!doctype html>
<html lang="{{locale.lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{{notFound.metaTitle}}</title>
    <meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20263f" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" vite-ignore />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <nav class="nav" aria-label="{{nav.ariaLabel}}">
        <a class="wordmark" href="/" aria-label="{{nav.wordmarkAria}}">{{nav.wordmark}}</a>
      </nav>
    </header>

    <main id="main">
      <section class="get" aria-labelledby="not-found-title">
        <h1 id="not-found-title" data-not-found="title">{{notFound.title}}</h1>
        <p data-not-found="body">{{notFound.body}}</p>
        <a class="button button-big" href="/" data-not-found="home">{{notFound.home}}</a>
      </section>
    </main>

    <script type="application/json" id="not-found-i18n">
      {{notFoundJson}}
    </script>
    <script type="module" src="/src/not-found.js"></script>
  </body>
</html>
